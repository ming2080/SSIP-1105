<!doctype html>
<html lang="zh-CN">

  <title>船厂三维场景 · Three.js</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#183344;background:#eaf2f4;font-synthesis:none;text-rendering:optimizeLegibility;font-optical-sizing:auto;font-weight:400;--ink:#183344;--muted:#718794;--line:#d7e3e7;--blue:#17617b;--blue2:#e7f2f5;--surface:#ffffffeb}

    .topbar{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#ffffffdc;border-bottom:1px solid #cfdee3;backdrop-filter:blur(16px);z-index:4}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#29829b,#14536f);border-radius:10px;box-shadow:0 5px 12px #14536f28}.brand-mark svg{width:21px;height:21px}.brand h1{font-size:16px;font-weight:680;letter-spacing:.015em;margin:0}.brand p{font-size:10px;color:#8498a1;margin:3px 0 0;letter-spacing:.12em}.top-actions{display:flex;align-items:center;gap:12px}.demo-tag{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #e3e9e8;border-radius:999px;background:#fff;color:#627b83;font-size:11px}.demo-tag i{width:7px;height:7px;border-radius:50%;background:#54b98e;box-shadow:0 0 0 3px #54b98e20}.shortcut{font-size:11px;color:#8498a1}
    .workspace{position:relative;flex:1;min-height:0}.scene{position:absolute;inset:0;background:linear-gradient(#c9e2ef,#dfeae8)}.scene canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}.scene canvas:active{cursor:grabbing}.scene-stamp{position:absolute;top:22px;left:24px;padding:11px 14px;border:1px solid #ffffffa8;background:#fffffff0;box-shadow:0 8px 30px #24475b15;border-radius:12px;backdrop-filter:blur(10px);pointer-events:none}.scene-stamp strong{display:block;font-size:13px;font-weight:650}.scene-stamp span{display:block;color:#8195a0;font-size:10px;margin-top:4px}.scene-controls{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border:1px solid #ffffffbd;border-radius:12px;background:#ffffffed;box-shadow:0 8px 28px #13334721;backdrop-filter:blur(16px);white-space:nowrap}.scene-controls button{height:34px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:#526e7b;font-size:11px;cursor:pointer;transition:background .16s,color .16s}.scene-controls button:hover,.scene-controls button.is-active{background:#e6f1f4;color:#145d78}.scene-controls button.icon{width:36px;padding:0;font-size:16px}.scene-help{position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:8px;color:#47616e;font-size:11px;text-shadow:0 1px 8px white;pointer-events:none}.scene-help .key{width:19px;height:19px;display:grid;place-items:center;border:1px solid #ffffff;border-radius:5px;background:#ffffffb8;color:#58717d;font-size:10px}.sidepanel{position:absolute;right:18px;top:18px;bottom:18px;width:310px;display:flex;flex-direction:column;border:1px solid #ffffffc9;border-radius:16px;background:var(--surface);box-shadow:0 18px 55px #143a4e20;backdrop-filter:blur(18px);overflow:hidden}.panel-head{padding:19px 18px 15px;border-bottom:1px solid #e7eef0}.panel-head h2{font-size:14px;margin:0;font-weight:680}.panel-head p{font-size:10px;color:#81949d;margin:5px 0 0}.layers{display:flex;gap:6px;padding:13px 16px 11px}.layer{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:31px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#778b93;font-size:10px;cursor:pointer}.layer[aria-pressed="true"]{color:#235767;border-color:#bed7df;background:#edf6f8}.layer i,.object-row i{width:7px;height:7px;flex:none;border-radius:50%;background:var(--dot)}.search-wrap{padding:0 16px 12px}.search-wrap input{height:36px;width:100%;border:1px solid #dce6e9;border-radius:9px;background:#f7fafb;padding:0 12px 0 34px;outline:none;font-size:11px;color:var(--ink)}.search-wrap input:focus{border-color:#78aab9;box-shadow:0 0 0 3px #5c9cae18}.search-box{position:relative}.search-box:before{content:"⌕";position:absolute;left:12px;top:4px;color:#8aa0a8;font-size:21px;pointer-events:none}.object-list{min-height:0;overflow:auto;padding:0 9px 8px;scrollbar-width:thin;scrollbar-color:#cbd8dc transparent}.list-title{display:flex;align-items:center;justify-content:space-between;padding:0 9px 7px;color:#8a9ba2;font-size:9px;letter-spacing:.04em}.list-title b{font-weight:500;color:#a5b2b7}.object-row{width:100%;display:flex;align-items:center;gap:10px;padding:9px 9px;border:0;border-radius:9px;background:transparent;text-align:left;cursor:pointer}.object-row:hover,.object-row.is-selected{background:#edf5f6}.object-row>span{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}.object-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:580;color:#314e5c}.object-row small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;color:#8b9ba2}.object-row b{font-size:9px;color:#7b949d;font-weight:500;opacity:0}.object-row:hover b,.object-row.is-selected b{opacity:1}.selection{margin:auto 12px 12px;padding:13px 13px 12px;border:1px solid #e1eaed;border-radius:11px;background:linear-gradient(145deg,#f8fbfc,#f2f7f8);min-height:76px}.selection-type{font-size:9px;color:#468298;margin-bottom:5px}.selection strong{display:block;font-size:12px;font-weight:630}.selection span{display:block;margin-top:4px;font-size:10px;color:#81939a}.selection button{margin-top:9px;border:0;background:none;color:#39819a;padding:0;font-size:10px;cursor:pointer}.selection-empty{font-size:10px;line-height:1.8;color:#85979e}.bottom-note{position:absolute;left:24px;top:78px;color:#4f6b78;font-size:9px;text-shadow:0 1px 7px #fff;pointer-events:none}.webgl-error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#e9f1f3;color:#294b5a;text-align:center;font-size:14px}.hidden{display:none!important}
    @media(max-width:760px){.topbar{height:56px;padding:0 14px}.brand h1{font-size:14px}.brand-mark{width:31px;height:31px}.shortcut{display:none}.demo-tag{font-size:9px;padding:6px 8px}.scene-stamp{left:12px;top:12px;padding:9px 11px}.sidepanel{top:auto;left:10px;right:10px;bottom:86px;width:auto;height:196px;border-radius:13px}.panel-head{padding:10px 12px 7px}.panel-head h2{font-size:12px}.panel-head p{display:none}.layers{padding:8px 11px 7px}.layer{height:27px}.search-wrap{padding:0 11px 7px}.search-wrap input{height:31px}.object-list{display:none}.selection{display:none}.scene-controls{bottom:12px;width:calc(100% - 20px);justify-content:center;flex-wrap:wrap;padding:5px;gap:2px}.scene-controls button{height:30px;padding:0 8px;font-size:10px}.scene-controls button.icon{width:30px}.scene-help{left:12px;bottom:59px;font-size:9px}.bottom-note{left:12px;top:59px;font-size:8px}}
    @media(max-width:390px){.scene-controls button{padding:0 6px;font-size:9px}.sidepanel{height:184px}.brand p{font-size:8px}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 16.8 6.3 8l3.4 5.1 2.4-3.5 3.1 7.2H3Z" fill="currentColor" opacity=".94"/><path d="M4 19.3h15.7M16.6 4.8l3.7 2.1-1.1 1.9-3.7-2.1 1.1-1.9Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>船厂三维数字孪生</h1><p>SHIPYARD DIGITAL TWIN</p></div></div>
      <div class="top-actions"><span class="shortcut">WebGL · Three.js</span><span class="demo-tag"><i></i>交互场景已就绪</span></div>
    </header>
    <section class="workspace">
      <div id="scene" class="scene"></div>
      <div class="scene-stamp"><strong>船厂全景模型</strong><span>码头 · 船台 · 生产区 · 办公生活区</span></div>
      <div class="bottom-note">示意模型与演示点位 · 非测绘坐标 · 非实时监测</div>
      <div class="scene-help"><span class="key">拖</span>旋转 <span class="key">右键</span>平移 <span class="key">滚轮</span>缩放</div>
      <nav class="scene-controls" aria-label="三维场景视角控制">
        <button class="is-active" data-preset="iso">斜俯视</button><button data-preset="top">顶视</button><button data-preset="dock">码头视角</button><button data-preset="campus">办公生活区</button><button class="icon" data-preset="iso" title="复位视角" aria-label="复位视角">↺</button><button class="icon" id="zoom-in" title="放大" aria-label="放大">＋</button><button class="icon" id="zoom-out" title="缩小" aria-label="缩小">−</button>
      </nav>
      <aside class="sidepanel">
        <div class="panel-head"><h2>场景对象</h2><p>筛选图层，点击对象定位到三维模型</p></div>
        <div class="layers"><button class="layer" data-layer="person" aria-pressed="true"><i style="--dot:#65cfa0"></i>人员</button><button class="layer" data-layer="device" aria-pressed="true"><i style="--dot:#53b5c7"></i>设备</button><button class="layer" data-layer="fence" aria-pressed="true"><i style="--dot:#e6a659"></i>电子围栏</button></div>
        <div class="search-wrap"><div class="search-box"><input id="search" type="search" placeholder="搜索人员、设备或区域" autocomplete="off" aria-label="搜索场景对象"></div></div>
        <div class="object-list"><div class="list-title">对象清单 <b>演示数据</b></div><div id="object-list"></div></div>
        <div id="selection" class="selection"></div>
      </aside>
      <div id="webgl-error" class="webgl-error hidden">此浏览器暂不支持 WebGL，请在支持 WebGL 的现代浏览器中打开。</div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
